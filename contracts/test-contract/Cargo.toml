[package]
name = "redsigma-test-contract"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.3", features = ["unit-testing"] }
near-contract-standards = "5.3"
redsigma-runtime = { path = "../../runtime" }
redsigma-parser = { path = "../../parser" }
redsigma-semantic = { path = "../../semantic" }
redsigma-dualstream = { path = "../../dualstream" }
redsigma-reflection = { path = "../../reflection" }
redsigma-causal = { path = "../../causal" }
redsigma-codegen = { path = "../../codegen" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
borsh = { version = "1.2", features = ["derive"] }
